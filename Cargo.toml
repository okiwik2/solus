[package]
name = "solus"
version = "1.0.0"
edition = "2021"
description = "Solus - a low-memory Chromium (WebView2) browser for Windows 11"
build = "build.rs"

[[bin]]
name = "solus"
path = "src/main.rs"

[dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"
windows-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
url = "2"
psl = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "single-thread"] }

[dependencies.ureq]
version = "3"
default-features = false
features = ["native-tls-no-default", "gzip", "json"]

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_WinRT",
  "Win32_Globalization",
  "Foundation",
  "Security_Credentials_UI",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "solus-sign"
path = "tools/sign.rs"
