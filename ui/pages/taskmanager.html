<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task manager</title>
<link rel="icon" href="/img/logo-256.png">
<link rel="stylesheet" href="/shared/base.css">
<script src="/shared/bridge.js"></script><script src="/shared/theme.js"></script><script src="/shared/icons.js"></script>
<style>
  .meter { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 8px; }
  .meter div { height: 100%; background: var(--accent); }
  td img { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  .st { font-size: 11.5px; }
  tr.sub td { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="wide" style="margin:0 auto">
  <div class="row-flex"><h1 style="flex:1">Task manager</h1><span class="muted small" id="profile"></span><button class="btn" id="freeAll">Unload background tabs</button></div>
  <div class="grid c4" id="stats" style="margin:16px 0"></div>
  <h2>Tabs</h2>
  <div class="card"><table class="list" id="tabs"></table></div>
  <h2>Processes</h2>
  <div class="card"><table class="list" id="procs"></table></div>
  <p class="muted small">Memory is each process's private working set — the RAM it alone is using. Solus shares one engine (browser, GPU and network processes) across all windows.</p>
</main>
<script src="/shared/page.js"></script>
<script>
  const mb = (b) => (b / 1048576).toFixed(b < 1048576 * 10 ? 1 : 0) + ' MB';
  let last = null;
  async function tick() {
    let d;
    try { d = await call('perf.snapshot'); } catch { return; }
    last = d;
    const sys = d.system;
    const used = sys.total - sys.available;
    const stat = (v, k, extra = '') => `<div class="card stat"><span class="v">${v}</span><span class="k">${k}</span>${extra}</div>`;
    const tabs = d.tabs || [];
    const live = tabs.filter((t) => !t.discarded).length;
    $('#stats').innerHTML = stat(mb(d.totalPrivateWs), 'Solus memory (all processes)') + stat(`${live} / ${tabs.length}`, 'tabs loaded') +
      stat(`${sys.load}%`, 'system memory in use', `<div class="meter"><div style="width:${sys.load}%"></div></div>`) +
      stat({ performance: 'Performance', balanced: 'Balanced', efficiency: 'Efficiency' }[d.effective] || d.effective, 'performance profile', sys.battery || sys.energySaver ? '<span class="pill warn">on battery</span>' : '');
    // memory per tab = renderer processes serving it (shared processes split evenly)
    const perTab = {};
    for (const p of d.processes) {
      if (!p.tabs || !p.tabs.length) continue;
      const share = p.privateWs / p.tabs.length;
      for (const t of p.tabs) perTab[t.tab] = (perTab[t.tab] || 0) + share;
    }
    $('#tabs').innerHTML = '<tr><th>Tab</th><th>State</th><th class="num">Memory</th><th></th></tr>' + tabs.sort((a, b) => (perTab[b.id] || 0) - (perTab[a.id] || 0)).map((t) => {
      const st = t.crashed ? '<span class="pill bad">crashed</span>' : t.discarded ? '<span class="pill">unloaded</span>' : t.frozen ? '<span class="pill ok">paused</span>' : t.audible ? '<span class="pill warn">playing audio</span>' : '<span class="pill ok" style="background:none">active</span>';
      return `<tr><td>${t.favicon ? `<img src="${esc(t.favicon)}">` : ''}${esc(t.title || t.url)}${t.incognito ? ' <span class="muted small">(Incognito)</span>' : ''}</td><td class="st">${st}</td><td class="num">${t.discarded ? '—' : perTab[t.id] ? mb(perTab[t.id]) : '…'}</td>
        <td style="text-align:right;white-space:nowrap">${!t.discarded ? `<button class="btn small" data-a="discard" data-id="${t.id}" data-w="${t.win}">Unload</button>` : ''}<button class="btn small" data-a="activate" data-id="${t.id}" data-w="${t.win}">Show</button></td></tr>`;
    }).join('');
    $('#procs').innerHTML = '<tr><th>Process</th><th>Used by</th><th class="num">Memory</th><th class="num">CPU</th><th></th></tr>' + d.processes.sort((a, b) => b.privateWs - a.privateWs).map((p) => {
      const names = (p.tabs || []).map((x) => (tabs.find((t) => t.id === x.tab) || {}).title).filter(Boolean);
      const by = p.ui ? 'Browser interface' : names.length ? names.join(', ') : (p.frames || []).map((f) => { try { return new URL(f).hostname; } catch { return f; } }).join(', ') || '—';
      return `<tr><td>${esc(p.kind)} <span class="muted small">${p.pid}</span></td><td style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(by)}">${esc(by)}</td><td class="num">${mb(p.privateWs)}</td><td class="num">${(p.cpu || 0).toFixed(1)}%</td><td>${p.kind === 'Renderer' && !p.ui ? `<button class="btn small" data-end="${p.pid}">End</button>` : ''}</td></tr>`;
    }).join('');
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-a]');
    if (a) { call(a.dataset.a === 'discard' ? 'perf.discard' : 'perf.activate', { id: +a.dataset.id, win: +a.dataset.w }).then(() => setTimeout(tick, 400)); return; }
    const end = e.target.closest('[data-end]');
    if (end) confirmBox('End this process?', 'The tabs it serves will show a "page crashed" message until reloaded.', 'End process', true).then((ok) => ok && call('perf.endProcess', { pid: +end.dataset.end }).then(() => setTimeout(tick, 600)).catch((er) => toast(er.message)));
  });
  $('#freeAll').onclick = () => { if (!last) return; const bg = (last.tabs || []).filter((t) => !t.discarded); Promise.all(bg.map((t) => call('perf.discard', { id: t.id, win: t.win }))).then(() => setTimeout(tick, 800)); };
  tick();
  setInterval(() => { if (!document.hidden) tick(); }, 2000);
</script>
</body>
</html>
