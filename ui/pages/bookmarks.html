<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmarks</title>
<link rel="icon" href="/img/logo-256.png">
<link rel="stylesheet" href="/shared/base.css">
<script src="/shared/bridge.js"></script><script src="/shared/theme.js"></script><script src="/shared/icons.js"></script>
<style>
  .bm-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
  .tree a { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; color: var(--text); text-decoration: none; }
  .tree a:hover { background: var(--tb-hover); }
  .tree a.on { background: var(--accent-soft); color: var(--accent); }
  .tree .kids { padding-left: 14px; }
  .brow { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--border); }
  .brow:first-child { border-top: 0; }
  .brow:hover { background: var(--tb-hover); }
  .brow img { width: 16px; height: 16px; }
  .brow .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .brow .u { color: var(--muted); font-size: 12px; max-width: 320px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .brow.drop { box-shadow: inset 0 2px 0 var(--accent); }
  .tree a.drop { outline: 2px dashed var(--accent); }
</style>
</head>
<body>
<main class="wide" style="margin:0 auto">
  <div class="row-flex" style="margin-bottom:14px"><h1 style="flex:1">Bookmarks</h1><input class="field" id="q" placeholder="Search bookmarks" style="width:300px"><button class="btn" id="addf">New folder</button><button class="btn" id="adds">Add bookmark</button></div>
  <div class="bm-layout"><div class="card pad tree" id="tree"></div><div><div class="muted small" id="crumb" style="margin-bottom:8px"></div><div class="card" id="list"></div></div></div>
</main>
<script src="/shared/page.js"></script>
<script>
  let cur = 'bar', q = '', items = [];
  async function tree() {
    const roots = await call('bookmarks.tree', { parent: 'root', depth: 8 });
    const walk = (nodes) => nodes.filter((n) => n.kind === 'folder').map((n) => `<a href="#" data-f="${esc(n.id)}" class="${n.id === cur ? 'on' : ''}">${icon(n.id === cur ? 'folderOpen' : 'folder', 16)}${esc(n.title)}</a>${(n.children || []).some((c) => c.kind === 'folder') ? `<div class="kids">${walk(n.children)}</div>` : ''}`).join('');
    $('#tree').innerHTML = walk(roots);
  }
  async function list() {
    items = q ? await call('bookmarks.search', { q }) : await call('bookmarks.children', { parent: cur });
    const f = q ? null : await call('bookmarks.get', { id: cur });
    $('#crumb').textContent = q ? `Results for “${q}”` : f ? f.title : '';
    $('#list').innerHTML = items.map((b, i) => `<div class="brow" draggable="true" data-i="${i}">${b.kind === 'folder' ? icon('folder', 16) : b.icon ? `<img src="${esc(b.icon)}">` : icon('globe', 16)}<span class="t">${esc(b.title || b.url)}</span><span class="u">${esc(b.url || '')}</span><button class="icon-btn" data-edit="${i}" title="Edit">${icon('edit', 15)}</button><button class="icon-btn" data-del="${i}" title="Delete">${icon('trash', 15)}</button></div>`).join('') || '<div class="empty">This folder is empty.</div>';
  }
  const refresh = () => Promise.all([tree(), list()]);
  $('#tree').onclick = (e) => { const a = e.target.closest('[data-f]'); if (!a) return; e.preventDefault(); cur = a.dataset.f; q = ''; $('#q').value = ''; refresh(); };
  $('#list').onclick = (e) => {
    const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    if (ed) return edit(items[+ed.dataset.edit]);
    if (del) { const b = items[+del.dataset.del]; return call('bookmarks.delete', { id: b.id }).then(() => { toast(`Deleted “${b.title}”`); refresh(); }); }
    const row = e.target.closest('.brow'); if (!row) return;
    const b = items[+row.dataset.i];
    if (b.kind === 'folder') { cur = b.id; refresh(); } else if (e.ctrlKey) call('newTab', { url: b.url, background: true }); else location.href = b.url;
  };
  $('#list').addEventListener('auxclick', (e) => { const row = e.target.closest('.brow'); if (row && e.button === 1) { const b = items[+row.dataset.i]; if (b.kind === 'url') call('newTab', { url: b.url, background: true }); } });
  // drag to reorder or move into folders
  let dragId = null;
  $('#list').addEventListener('dragstart', (e) => { const r = e.target.closest('.brow'); dragId = items[+r.dataset.i].id; });
  $('#list').addEventListener('dragover', (e) => { const r = e.target.closest('.brow'); if (r) { e.preventDefault(); $$('.drop').forEach((x) => x.classList.remove('drop')); r.classList.add('drop'); } });
  $('#list').addEventListener('drop', (e) => { const r = e.target.closest('.brow'); if (!r || !dragId || q) return; e.preventDefault(); const t = items[+r.dataset.i]; const p = t.kind === 'folder' && e.shiftKey ? call('bookmarks.move', { id: dragId, parent: t.id, index: 9999 }) : call('bookmarks.move', { id: dragId, parent: cur, index: +r.dataset.i }); p.then(refresh).catch((er) => toast(er.message)); });
  $('#tree').addEventListener('dragover', (e) => { const a = e.target.closest('[data-f]'); if (a) { e.preventDefault(); $$('.drop').forEach((x) => x.classList.remove('drop')); a.classList.add('drop'); } });
  $('#tree').addEventListener('drop', (e) => { const a = e.target.closest('[data-f]'); if (!a || !dragId) return; e.preventDefault(); call('bookmarks.move', { id: dragId, parent: a.dataset.f, index: 9999 }).then(refresh).catch((er) => toast(er.message)); });
  function edit(b) {
    modal(`<h3>${b ? 'Edit' : 'Add'} ${b && b.kind === 'folder' ? 'folder' : 'bookmark'}</h3><p class="muted small">Name</p><input class="field" data-n style="width:100%" value="${esc(b ? b.title : '')}">${!b || b.kind === 'url' ? `<p class="muted small" style="margin-top:10px">URL</p><input class="field" data-u style="width:100%" value="${esc(b ? b.url : 'https://')}">` : ''}<div class="actions"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`, (m, close) => {
      $('[data-x]', m).onclick = () => close();
      $('[data-ok]', m).onclick = () => {
        const title = $('[data-n]', m).value.trim(), url = $('[data-u]', m)?.value.trim();
        (b ? call('bookmarks.update', { id: b.id, title, url: b.kind === 'url' ? url : undefined }) : call('bookmarks.add', { parent: cur, title: title || url, url })).then(() => { close(); refresh(); }).catch((e) => toast(e.message));
      };
    });
  }
  $('#adds').onclick = () => edit(null);
  $('#addf').onclick = () => modal(`<h3>New folder</h3><input class="field" data-n style="width:100%" placeholder="Folder name"><div class="actions"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Create</button></div>`, (m, close) => {
    $('[data-x]', m).onclick = () => close();
    $('[data-ok]', m).onclick = () => call('bookmarks.add', { parent: cur, kind: 'folder', title: $('[data-n]', m).value.trim() || 'New folder' }).then(() => { close(); refresh(); });
  });
  $('#q').oninput = (e) => { q = e.target.value.trim(); list(); };
  solus.on('bookmarksChanged', refresh);
  refresh();
</script>
</body>
</html>
