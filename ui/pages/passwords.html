<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passwords</title>
<link rel="icon" href="/img/logo-256.png">
<link rel="stylesheet" href="/shared/base.css">
<script src="/shared/bridge.js"></script><script src="/shared/theme.js"></script><script src="/shared/icons.js"></script>
</head>
<body>
<main style="margin:0 auto">
  <div class="row-flex"><h1 style="flex:1">Passwords</h1><input class="field" id="q" placeholder="Search passwords" style="width:260px"><button class="btn" id="add">Add</button><button class="btn" id="more">Import / export</button></div>
  <p class="muted small">Saved on this PC, encrypted with a key that only your Windows account can unlock. Showing or exporting a password asks Windows to confirm it's you.</p>
  <div class="grid c3" id="health" style="margin:14px 0"></div>
  <div class="card" id="list"></div>
  <h2>Never saved</h2><div class="card" id="never"></div>
</main>
<script src="/shared/page.js"></script>
<script>
  let rows = [];
  async function load() {
    rows = await call('passwords.list');
    const weak = rows.filter((r) => r.weak).length, reused = rows.filter((r) => r.reused).length;
    $('#health').innerHTML = `<div class="card stat"><span class="v">${rows.length}</span><span class="k">saved passwords</span></div><div class="card stat"><span class="v" style="color:${weak ? 'var(--warn)' : 'inherit'}">${weak}</span><span class="k">weak</span></div><div class="card stat"><span class="v" style="color:${reused ? 'var(--warn)' : 'inherit'}">${reused}</span><span class="k">reused on several sites</span></div>`;
    draw();
    const nv = await call('passwords.neverList');
    $('#never').innerHTML = nv.map((o) => `<div class="item"><span class="grow">${esc(o)}</span><button class="btn small" data-unnever="${esc(o)}">Remove</button></div>`).join('') || '<div class="item muted">No sites.</div>';
  }
  function draw() {
    const q = $('#q').value.toLowerCase();
    const list = rows.filter((r) => !q || r.host.toLowerCase().includes(q) || r.username.toLowerCase().includes(q));
    $('#list').innerHTML = list.map((r) => `<div class="item" data-id="${esc(r.id)}"><div class="grow"><div class="label">${esc(r.host)}</div><div class="desc">${esc(r.username || '(no username)')} ${r.weak ? '<span class="pill warn">weak</span>' : ''} ${r.reused ? '<span class="pill warn">reused</span>' : ''}</div></div>
      <code data-pw style="min-width:120px">••••••••</code><button class="icon-btn" data-a="show" title="Show">${icon('eye', 16)}</button><button class="icon-btn" data-a="copy" title="Copy password">${icon('copy', 16)}</button><button class="icon-btn" data-a="edit" title="Edit">${icon('edit', 16)}</button><button class="icon-btn" data-a="del" title="Delete">${icon('trash', 16)}</button></div>`).join('') || `<div class="empty">${rows.length ? 'No matches.' : 'No saved passwords yet. Solus offers to save a password when you sign in to a site, or you can import them from Chrome.'}</div>`;
  }
  $('#list').onclick = async (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const row = b.closest('[data-id]'); const id = row.dataset.id; const r = rows.find((x) => x.id === id);
    try {
      if (b.dataset.a === 'show') { const s = await call('passwords.reveal', { id }); const c = $('[data-pw]', row); c.textContent = c.textContent.startsWith('•') ? s.password : '••••••••'; }
      if (b.dataset.a === 'copy') { const s = await call('passwords.reveal', { id }); await navigator.clipboard.writeText(s.password); toast('Password copied.'); }
      if (b.dataset.a === 'del') { if (await confirmBox('Delete this password?', `${r.host} — ${r.username}`, 'Delete', true)) { await call('passwords.delete', { id }); load(); } }
      if (b.dataset.a === 'edit') { const s = await call('passwords.reveal', { id }); editor({ ...r, password: s.password, note: s.note }); }
    } catch (er) { toast(er.message); }
  };
  $('#never').onclick = (e) => { const b = e.target.closest('[data-unnever]'); if (b) call('passwords.removeNever', { origin: b.dataset.unnever }).then(load); };
  function editor(r) {
    modal(`<h3>${r ? 'Edit password' : 'Add password'}</h3><p class="muted small">Site</p><input class="field" data-u style="width:100%" value="${esc(r ? r.origin : 'https://')}">
      <p class="muted small" style="margin-top:8px">Username</p><input class="field" data-n style="width:100%" value="${esc(r ? r.username : '')}">
      <p class="muted small" style="margin-top:8px">Password</p><div class="row-flex"><input class="field" data-p style="flex:1" value="${esc(r ? r.password : '')}"><button class="btn small" data-gen>Generate</button></div>
      <p class="muted small" style="margin-top:8px">Note</p><textarea class="field" data-note rows="2" style="width:100%">${esc(r ? r.note : '')}</textarea>
      <div class="actions"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`, (m, close) => {
      $('[data-x]', m).onclick = () => close();
      $('[data-gen]', m).onclick = () => call('passwords.generate', { length: 18 }).then((p) => ($('[data-p]', m).value = p));
      $('[data-ok]', m).onclick = () => call('passwords.save', { id: r ? r.id : '', url: $('[data-u]', m).value.trim(), username: $('[data-n]', m).value, password: $('[data-p]', m).value, note: $('[data-note]', m).value }).then(() => { close(); load(); }).catch((e) => toast(e.message));
    });
  }
  $('#add').onclick = () => editor(null);
  $('#more').textContent = 'Import / export';
  $('#more').onclick = () => modal(`<h3>Import or export</h3>
    <p class="small"><b>From Chrome:</b> Chrome only lets its own export read its passwords.<br>1. <button class="btn small" data-chrome>Open Chrome password settings</button> → <b>Export passwords</b>.<br>2. <button class="btn small" data-imp>Choose the CSV file…</button></p>
    <label class="row-flex small"><input type="checkbox" data-del checked> Securely delete the CSV after importing</label>
    <p class="small muted">Also works with exports from Edge, Firefox and Bitwarden.</p>
    <p class="small"><b>Export:</b> <button class="btn small" data-exp>Export to CSV…</button> <span class="muted">(the file is not encrypted — keep it safe)</span></p>
    <div class="actions"><button class="btn" data-x>Close</button></div>`, (m, close) => {
    $('[data-x]', m).onclick = () => close();
    $('[data-chrome]', m).onclick = () => call('passwords.openChromeExport').catch((e) => toast(e.message));
    $('[data-imp]', m).onclick = () => call('app.pickFile', { filter: 'CSV files|*.csv' }).then((p) => p && call('passwords.importCsv', { path: p, deleteFile: $('[data-del]', m).checked })).then((r) => { if (r) { toast(`Imported: ${r.added} added, ${r.updated} updated${r.fileDeleted ? '; file deleted' : ''}.`); close(); load(); } }).catch((e) => toast(e.message));
    $('[data-exp]', m).onclick = () => call('passwords.exportCsv').then((p) => p && toast('Exported to ' + p)).catch((e) => toast(e.message));
  });
  $('#q').oninput = draw;
  load();
</script>
</body>
</html>
